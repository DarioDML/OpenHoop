name: App builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/locales/**'
      - 'apps/mobile/src/ble/**'
      - '.github/workflows/apps.yml'

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Install workspace packages the app imports by path
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Use the release keystore when one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "OPENHOOP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with the public debug key. Use it for testing only."
          fi
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          OPENHOOP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENHOOP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENHOOP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/OpenHoop-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: openhoop-android
          path: ${{ runner.temp }}/OpenHoop-android.apk
          if-no-files-found: error

  ios:
    name: iOS IPA and simulator check
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Install workspace packages the app imports by path
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: xcodebuild -version
      - run: npx expo prebuild --platform ios --clean
      - name: Build unsigned IPA for sideloading
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace OpenHoop.xcworkspace -scheme OpenHoop -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/device/Build/Products/Release-iphoneos/OpenHoop.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/OpenHoop-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: openhoop-ios
          path: ${{ runner.temp }}/OpenHoop-ios-unsigned.ipa
          if-no-files-found: error
      - name: Build for the simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace OpenHoop.xcworkspace -scheme OpenHoop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/simulator" \
            -quiet build
      - name: Launch on a simulator and check the app stays up
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items()) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/simulator/Build/Products/Release-iphonesimulator/OpenHoop.app"
          xcrun simctl launch "$UDID" app.openhoop.mobile
          sleep 30
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/ios-simulator.png"
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q 'app.openhoop.mobile'; then
            echo "::error::OpenHoop is no longer running 30 seconds after launch on the simulator."
            ls ~/Library/Logs/DiagnosticReports/ | grep -i openhoop && cat ~/Library/Logs/DiagnosticReports/OpenHoop* | head -80
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-screenshot
          path: ${{ runner.temp }}/ios-simulator.png
          if-no-files-found: ignore

  release:
    name: Publish to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: openhoop-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/OpenHoop-android.apk dist/OpenHoop-ios-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --title "OpenHoop $GITHUB_REF_NAME" --prerelease --generate-notes \
            --notes "How to install on Android or iPhone: https://github.com/$GITHUB_REPOSITORY/blob/master/docs/installeren.md"
