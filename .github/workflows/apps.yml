name: App builds

on:
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the release path (CI, unsigned build, signing with a throwaway key) without publishing
        type: boolean
        default: false
  push:
    branches: [master]
    tags: ['v*']
    paths: &native-paths
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/locales/**'
      - 'apps/mobile/src/ble/**'
      - '.github/workflows/apps.yml'
  pull_request:
    paths: *native-paths

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_BUILD: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true) }}

jobs:
  verify:
    name: CI
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true)
    uses: ./.github/workflows/ci.yml

  guard:
    name: Release guard
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag matches app.json and is on master
        run: |
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            case "${GITHUB_REF_NAME#v}" in
              "$version" | "$version"-*) ;;
              *) echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $version. Bump expo.version first."; exit 1 ;;
            esac
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::$GITHUB_REF_NAME points at a commit that is not on master."
              exit 1
            fi
          fi
          echo "Release version $version"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install workspace packages the app imports by path
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Mark test builds
        if: env.RELEASE_BUILD != 'true'
        run: echo "::warning::This APK is signed with the public debug key. Use it for testing only."
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          OPENHOOP_UNSIGNED_RELEASE: ${{ env.RELEASE_BUILD == 'true' && '1' || '' }}
        run: ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Collect the APK
        run: |
          if [ "$RELEASE_BUILD" = true ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/OpenHoop-android-unsigned.apk"
          else
            cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/OpenHoop-android.apk"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RELEASE_BUILD == 'true'
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/OpenHoop-android-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RELEASE_BUILD != 'true'
        with:
          name: openhoop-android
          path: ${{ runner.temp }}/OpenHoop-android.apk
          if-no-files-found: error

  sign-android:
    name: Sign Android APK
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true)
    needs: [android, guard, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'release' || 'release-dry-run' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Align, sign and verify
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          if [ "$IS_TAG" = true ]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::The release environment needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            KEY_PASS="${KEY_PASS:-$KS_PASS}"
          else
            echo "::notice::Dry run: signing with a throwaway key generated for this run."
            KS_PASS=$(openssl rand -hex 24)
            KEY_PASS="$KS_PASS"
            KEY_ALIAS=dry-run
            echo "::add-mask::$KS_PASS"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 1 -dname "CN=OpenHoop release dry run"
          fi
          export KS_PASS KEY_PASS
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned="$RUNNER_TEMP/unsigned/OpenHoop-android-unsigned.apk"
          aligned="$RUNNER_TEMP/aligned.apk"
          "$build_tools/zipalign" -f -P 16 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --ks-key-alias "$KEY_ALIAS" --out "$RUNNER_TEMP/OpenHoop-android.apk" "$aligned"
          rm -f "$keystore"
          "$build_tools/zipalign" -c -P 16 4 "$RUNNER_TEMP/OpenHoop-android.apk"
          certs=$("$build_tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/OpenHoop-android.apk")
          echo "$certs"
          if [ "$IS_TAG" = true ]; then
            if [ -z "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::Set the repository variable ANDROID_SIGNING_CERT_SHA256 to the release certificate fingerprint."
              exit 1
            fi
            actual=$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
            expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            if [ "$actual" != "$expected" ]; then
              echo "::error::The APK was signed with certificate $actual, but ANDROID_SIGNING_CERT_SHA256 expects $expected."
              exit 1
            fi
          fi
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openhoop-android
          path: ${{ runner.temp }}/OpenHoop-android.apk
          if-no-files-found: error

  ios:
    name: iOS IPA and simulator check
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUILD_DEVICE_IPA: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Start booting a simulator while the app builds
        working-directory: .
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(devices.items(), key=lambda kv: [int(n) for n in re.findall(r"\d+", kv[0])])
          phones = [d for runtime, ds in runtimes if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          if not phones:
              sys.exit("No available iPhone simulator on this runner image")
          print(phones[-1]["udid"])
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Install workspace packages the app imports by path
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: xcodebuild -version
      - run: npx expo prebuild --platform ios --clean
      - name: Build unsigned IPA for sideloading
        if: env.BUILD_DEVICE_IPA == 'true'
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace OpenHoop.xcworkspace -scheme OpenHoop -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/device/Build/Products/Release-iphoneos/OpenHoop.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/OpenHoop-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.BUILD_DEVICE_IPA == 'true'
        with:
          name: openhoop-ios
          path: ${{ runner.temp }}/OpenHoop-ios-unsigned.ipa
          if-no-files-found: error
      - name: Build for the simulator (arm64 only, the runner's architecture)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace OpenHoop.xcworkspace -scheme OpenHoop -configuration Release \
            -sdk iphonesimulator -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/simulator" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -quiet build
      - name: Launch on the simulator and check the app stays up
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$RUNNER_TEMP/simulator/Build/Products/Release-iphonesimulator/OpenHoop.app"
          xcrun simctl launch "$SIM_UDID" app.openhoop.mobile
          sleep 30
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/ios-simulator.png"
          if ! xcrun simctl spawn "$SIM_UDID" launchctl list | grep -q 'app.openhoop.mobile'; then
            echo "::error::OpenHoop is no longer running 30 seconds after launch on the simulator."
            ls ~/Library/Logs/DiagnosticReports/ | grep -i openhoop && cat ~/Library/Logs/DiagnosticReports/OpenHoop* | head -80
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator-screenshot
          path: ${{ runner.temp }}/ios-simulator.png
          if-no-files-found: ignore

  release:
    name: Publish to GitHub Releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, guard, sign-android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openhoop-android
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openhoop-ios
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum OpenHoop-android.apk OpenHoop-ios-unsigned.ipa | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/OpenHoop-android.apk
            dist/OpenHoop-ios-unsigned.ipa
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/OpenHoop-android.apk dist/OpenHoop-ios-unsigned.ipa dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "OpenHoop $GITHUB_REF_NAME" --prerelease --generate-notes \
            --notes "How to install on Android or iPhone: https://github.com/$GITHUB_REPOSITORY/blob/master/docs/installeren.md

          Check a download: compare it with SHA256SUMS.txt, or run \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
