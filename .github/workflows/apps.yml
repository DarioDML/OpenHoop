name: App builds

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths: &native-paths
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/locales/**'
      - 'apps/mobile/src/ble/**'
      - '.github/workflows/apps.yml'
  pull_request:
    paths: *native-paths

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install workspace packages the app imports by path
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Use the release keystore for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::A tagged release needs the ANDROID_KEYSTORE_BASE64 secret; it will not publish a debug-signed APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "OPENHOOP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Mark untagged builds as test builds
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "::warning::This APK is signed with the public debug key. Use it for testing only."
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          OPENHOOP_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          OPENHOOP_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
          OPENHOOP_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/OpenHoop-android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openhoop-android
          path: ${{ runner.temp }}/OpenHoop-android.apk
          if-no-files-found: error

  ios:
    name: iOS IPA and simulator check
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUILD_DEVICE_IPA: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Start booting a simulator while the app builds
        working-directory: .
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items()) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Install workspace packages the app imports by path
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: xcodebuild -version
      - run: npx expo prebuild --platform ios --clean
      - name: Build unsigned IPA for sideloading
        if: env.BUILD_DEVICE_IPA == 'true'
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace OpenHoop.xcworkspace -scheme OpenHoop -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/device/Build/Products/Release-iphoneos/OpenHoop.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/OpenHoop-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.BUILD_DEVICE_IPA == 'true'
        with:
          name: openhoop-ios
          path: ${{ runner.temp }}/OpenHoop-ios-unsigned.ipa
          if-no-files-found: error
      - name: Build for the simulator (arm64 only, the runner's architecture)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace OpenHoop.xcworkspace -scheme OpenHoop -configuration Release \
            -sdk iphonesimulator -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/simulator" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -quiet build
      - name: Launch on the simulator and check the app stays up
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$RUNNER_TEMP/simulator/Build/Products/Release-iphonesimulator/OpenHoop.app"
          xcrun simctl launch "$SIM_UDID" app.openhoop.mobile
          sleep 30
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/ios-simulator.png"
          if ! xcrun simctl spawn "$SIM_UDID" launchctl list | grep -q 'app.openhoop.mobile'; then
            echo "::error::OpenHoop is no longer running 30 seconds after launch on the simulator."
            ls ~/Library/Logs/DiagnosticReports/ | grep -i openhoop && cat ~/Library/Logs/DiagnosticReports/OpenHoop* | head -80
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator-screenshot
          path: ${{ runner.temp }}/ios-simulator.png
          if-no-files-found: ignore

  release:
    name: Publish to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openhoop-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/OpenHoop-android.apk dist/OpenHoop-ios-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --title "OpenHoop $GITHUB_REF_NAME" --prerelease --generate-notes \
            --notes "How to install on Android or iPhone: https://github.com/$GITHUB_REPOSITORY/blob/master/docs/installeren.md"
